[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --no-header
markers =
    live: marks tests requiring live LLM API (deselect with '-m "not live"')
    slow: marks slow tests (FAISS build, model load)
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
